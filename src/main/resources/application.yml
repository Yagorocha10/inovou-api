server:
  port: 8081

spring:
  application:
    name: inovou-api
  datasource:
    url: jdbc:postgresql://localhost:5432/inovou
    username: inovou
    password: inovou
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 20
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html

inovou:
  jwt:
    segredo: ${INOVOU_JWT_SEGREDO:segredo-de-desenvolvimento-da-inovou-store-troque-em-producao}
    expiracao: PT8H
  admin:
    email: ${INOVOU_ADMIN_EMAIL:admin@inovoustore.local}
    senha: ${INOVOU_ADMIN_SENHA:admin12345}
  uploads:
    diretorio: ${INOVOU_UPLOADS_DIR:./uploads}
