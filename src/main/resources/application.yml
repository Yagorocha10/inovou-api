server:
  port: 8081

spring:
  application:
    name: inovou-api
  datasource:
    url: jdbc:postgresql://localhost:5432/inovou
    username: inovou
    password: inovou
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 20
  flyway:
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
